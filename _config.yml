# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Applied Geostatistics in Python
author: Michael J. Pyrcz
logo: _static/intro/AppliedGeostats.jpg
copyright: "2024"  # Copyright year to be placed in the footer


#######################################################################################
# Execution settings
# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html

execute:
  execute_notebooks: force          # Must be one of ("auto", "force", "cache", "off")
  cache                     : ""     # A path to the jupyter cache that will be used to store execution artifacts
  exclude_patterns          : []     # A list of patterns to skip in execution
  timeout                   : 3000   # Maximum execution time (seconds)
  run_in_temp               : false  # Execute notebooks in their source directory
  allow_errors              : false  # Stop if a notebook cell raises an error
  stderr_output             : show   # One of 'show', 'remove', 'remove-warn', 'warn', 'error', 'severe'


#######################################################################################
# LaTeX settings

latex:
  latex_documents:
    targetname: book.tex


#######################################################################################
# Bibliography settings

bibtex_bibfiles:
  - references.bib


#######################################################################################
# Repository settings

repository:
  url: https://github.com/executablebooks/GeostatsPyDemos_Book/
  path_to_book: docs
  branch: master


#######################################################################################
# HTML settings

html:
  use_issues_button: true
  use_repository_button: true

  extra_footer: |
    <div style="
      margin-top:1em;
      text-align:center;
      width:100%;
      ">
      <img src="_static/images/backcover.png"
           alt="Applied Geostatistics in Python back cover"
           style="
             display:block;
             margin-left: 25px;
             margin-right:auto;
             width:77.5%;
             max-width:775px;
           ">
    </div>


#######################################################################################
# Sphinx configuration
# Custom templates and automatic heading anchors

# Custom templates
sphinx:
  config:
    # Enable automatic anchor generation for all headings up to level 4 (####)
    myst_heading_anchors: 4
